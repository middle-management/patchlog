[package]
name = "patchlog-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Platform-neutral core of patchlog: I-JSON input, canonical JSON, ids, names, JSON Patch, limits"

[dependencies]
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false }
ryu-js = "1"
regex = "1"
serde_json = "1"
jsonschema = { version = "0.60", default-features = false, features = ["idna"] }
