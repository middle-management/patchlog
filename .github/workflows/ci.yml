name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # DynamoDB Local, for internal/ddbstore's and internal/core's
      # DDB_ENDPOINT-gated integration tests (docs/DYNAMODB.md).
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      DDB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'ed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...

  # The race detector, in its own job so it runs alongside the others.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/core ./internal/server ./internal/merge ./internal/index ./internal/tree

  # The API-level suites again, on DynamoDB (docs/DYNAMODB.md): every test
  # server (the server package's harness, clienttest) gets a fresh table
  # (internal/testenv). What the backend hasn't built skips; its known
  # divergences (internal/testenv/known_dynamodb.txt) skip until fixed.
  # DynamoDB Local serves about one request at a time, so the tests' tables
  # are spread over four of them (a third faster than one).
  dynamodb:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
      dynamodb1:
        image: amazon/dynamodb-local:latest
        ports:
          - 8001:8000
      dynamodb2:
        image: amazon/dynamodb-local:latest
        ports:
          - 8002:8000
      dynamodb3:
        image: amazon/dynamodb-local:latest
        ports:
          - 8003:8000
    env:
      PATCHLOG_TEST_BACKEND: dynamodb
      DDB_ENDPOINT: http://localhost:8000,http://localhost:8001,http://localhost:8002,http://localhost:8003
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...

  # Every package's tests again with blob bytes in S3 (internal/s3blobs), on
  # each backend: SeaweedFS's S3 gateway, a prefix of one bucket per test
  # (internal/testenv, PATCHLOG_TEST_BLOBS). SeaweedFS needs a command,
  # which service containers can't take, so a step starts it; without an
  # identity configuration it accepts any credentials.
  s3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres, dynamodb]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
      dynamodb1:
        image: amazon/dynamodb-local:latest
        ports:
          - 8001:8000
      dynamodb2:
        image: amazon/dynamodb-local:latest
        ports:
          - 8002:8000
      dynamodb3:
        image: amazon/dynamodb-local:latest
        ports:
          - 8003:8000
    env:
      PATCHLOG_TEST_BACKEND: ${{ matrix.backend }}
      PATCHLOG_TEST_PG: ${{ matrix.backend == 'postgres' && 'postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable' || '' }}
      DDB_ENDPOINT: ${{ matrix.backend == 'dynamodb' && 'http://localhost:8000,http://localhost:8001,http://localhost:8002,http://localhost:8003' || '' }}
      PATCHLOG_TEST_BLOBS: s3://patchlog-test?region=us-east-1&endpoint=http://localhost:8333
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: start SeaweedFS
        run: |
          docker run -d --name seaweedfs -p 8333:8333 chrislusf/seaweedfs server -s3 -dir=/data
          for i in $(seq 60); do curl -s -o /dev/null http://localhost:8333/ && exit 0; sleep 1; done
          docker logs seaweedfs; exit 1
      - run: go test ./...

  # Every package's tests again, on Postgres (Addendum D.8): each test that
  # opens a store gets a fresh database (internal/pgtest), including the
  # services' tests through clienttest.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      PATCHLOG_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./internal/...

  # The same on Postgres, with the race detector.
  postgres-race:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      PATCHLOG_TEST_PG: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/core ./internal/server ./internal/index

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: build the image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
