# Releases and images.
#
#   push a tag v1.2.3  → GitHub Release with binaries (linux, darwin,
#                        windows × amd64, arm64) and checksums, and the
#                        image ghcr.io/<owner>/patchlog:1.2.3, :1.2, :latest
#                        (tags with a "-", e.g. v1.2.3-rc.1, are prereleases:
#                        no :latest, no :1.2)
#   push to main       → image ghcr.io/<owner>/patchlog:edge and :sha-<short>
#   run manually with a version (Actions → Release → Run workflow, or the
#   API)   → the same as pushing that tag: the workflow creates the tag on
#            the commit it runs on, the release and the images. For when a
#            tag can't be pushed directly.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.0 (creates the tag on this commit). Empty: build the images only."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  binaries:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: check the version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "not a version: $VERSION"; exit 1; }
          if gh api "repos/${{ github.repository }}/git/ref/tags/$VERSION" >/dev/null 2>&1; then echo "tag $VERSION already exists"; exit 1; fi
      - run: go test ./...
      - name: build
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            name=patchlog_${VERSION}_${os}_${arch}
            dir=dist/$name
            mkdir -p "$dir"
            ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" -o "$dir/patchlog$ext" ./cmd/patchlog
            cp README.md LICENSE "$dir/"
            mkdir -p "$dir/docs" && cp docs/SPEC.md "$dir/docs/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -rf "$dir"
          done
          (cd dist && sha256sum * > "patchlog_${VERSION}_checksums.txt")
          ls -l dist
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        # A release drafted in GitHub's UI creates the tag (which runs this
        # workflow) and the release itself: attach the assets to it. For a
        # plain tag push, create the release.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
            # A pushed tag must exist; a manual run creates it on this commit.
            if [ -n "${{ inputs.version }}" ]; then where="--target $GITHUB_SHA"; else where="--verify-tag"; fi
            # The tag's section of CHANGELOG.md, if it has one, heads the
            # notes; GitHub's generated list of changes follows.
            awk -v tag="$TAG" '$0 == "## " tag {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md 2>/dev/null || true
            if [ -s notes.md ]; then notes="--notes-file notes.md"; else notes=""; fi
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes $notes $where $pre
          fi

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # The final stage runs a RUN step (adduser), which needs emulation
      # for the arm64 image; the Go build itself cross-compiles.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},enable=${{ inputs.version == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.version == '' && !contains(github.ref_name, '-') }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' && !contains(inputs.version, '-') }}
            type=raw,value=latest,enable=${{ (startsWith(github.ref, 'refs/tags/v') || inputs.version != '') && !contains(inputs.version || github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || format('edge-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
