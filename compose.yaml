# The whole stack in development mode (no authentication; X-Author names
# the author). Start it with `docker compose up --build` or `make up`.
#
# Everything is served through a local CDN (Varnish, deploy/varnish), which
# caches by the origins' Cache-Control / CDN-Cache-Control and is purged by
# cache tag (§9). Reads and writes both go through it:
#
#   http://localhost:8080             core API (through the CDN)
#   http://localhost:8080/playground/ web playground
#   http://localhost:8081             search index (Addendum A), e.g. /demo?q=derby; the
#                                     playground's Search tab reads it through the core's
#                                     read-only proxy at /playground/index/ (-index-url)
#   http://localhost:8082             tree service (Addendum B), e.g. /cat/roots (the
#                                     catalog cat, a tree) and /topics/roots (topics,
#                                     a DAG); the playground reads it through the
#                                     core's read-only proxy at /playground/tree/
#                                     (-tree-url) and switches between the two
#
# The origins, bypassing the CDN (debugging):
#
#   http://localhost:9080 core · http://localhost:9081 search · http://localhost:9082 tree
#
# `make cdn-check` shows caching and purging at work; send `X-Cache-Debug: 1`
# to see a response's cache tags and edge TTL.
#
# Data (databases, blob files, archives, the at-rest master key) lives in
# the `data` volume; `docker compose down -v` wipes it.
#
# Health and shutdown: the core, index and tree answer GET /_health (200
# while serving, 503 once shutdown starts) and /_ready. Their healthchecks
# run `patchlog health`, so the image needs no curl or wget. On `docker
# compose stop` / `down` they drain: long-polls and event streams end at
# once, other requests get up to -shutdown-timeout (20s) before they are
# cancelled and roll back, and stop_grace_period (30s) leaves room for that
# plus the engine's and the CDN purger's own shutdown before Docker kills
# the process.

x-patchlog: &patchlog
  build: .
  image: patchlog:dev
  restart: unless-stopped
  # Longer than -shutdown-timeout (+ -shutdown-delay), so a graceful
  # shutdown isn't cut short by SIGKILL.
  stop_grace_period: 30s
  volumes:
    - data:/data
  environment:
    # Browser pages on other origins (a demo app): e.g.
    # PATCHLOG_CORS_ORIGINS=http://localhost:5173 docker compose up, or *.
    PATCHLOG_CORS_ORIGINS: ${PATCHLOG_CORS_ORIGINS:-}
    # OpenTelemetry (README, Observability): off unless an endpoint or
    # exporter is set, e.g. with the jaeger profile below:
    #   OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 OTEL_METRICS_EXPORTER=none \
    #     docker compose --profile otel up --build
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}
    OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
    OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
    OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-}
    OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}

services:
  patchlog:
    <<: *patchlog
    command:
      - serve
      - -dev
      - -addr=:8080
      # URLs the core generates point at the CDN.
      - -origin=${PATCHLOG_ORIGIN:-http://localhost:8080}
      - -db=/data/patchlog.db
      - -blob-dir=/data/blobs
      - -archive=file:///data/archive
      - -master-key=/data/master.key
      - -master-key-create
      # The playground's Catalog tab reads the tree service through a
      # same-origin, GET-only proxy at /playground/tree/. The tree service
      # starts after the core (it waits for the seed), so the proxy answers
      # 502 until it is up. It serves both catalogs; a catalog served
      # elsewhere would be mapped with another -tree-url CATALOG=URL.
      - -tree-url=http://tree:8082
      # The Search tab reads the index the same way, at /playground/index/.
      # It follows demo; like the tree service it starts after the seed.
      - -index-url=http://index:8081
      # The Schemas tab plans imports of external JSON Schemas; the core
      # fetches the URLs it is given, from these hosts only (and never from
      # private addresses unless listed). Without -schema-fetch the tab takes
      # uploaded files only.
      - -schema-fetch
      - -schema-fetch-hosts=www.schemastore.org,json.schemastore.org,raw.githubusercontent.com
      # Cache-tag purges (tombstone purges, namespace purges, …). The CDN
      # starts last; purges sent before it is up are logged and dropped,
      # which is harmless: nothing is cached yet.
      - -purge-url=http://cdn:8080/
      # Graceful shutdown: in-flight requests get 20s, under the 30s
      # stop_grace_period. With a load balancer in front of several
      # instances, add e.g. -shutdown-delay=5s so it sees /_health go 503
      # before the listener closes (one instance behind the CDN gains
      # nothing from it).
      - -shutdown-timeout=20s
    ports:
      - "${CORE_DIRECT_PORT:-9080}:8080"
    healthcheck:
      test: ["CMD", "patchlog", "health", "http://localhost:8080/_health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: creates the demo namespaces (among them two catalogs, cat as a
  # tree and topics as a DAG, a sealed and an e2e namespace), schemas and a
  # few documents. Talks to the core directly.
  seed:
    image: curlimages/curl:8.16.0
    entrypoint: ["sh", "/deploy/seed.sh"]
    restart: "no"
    volumes:
      - ./deploy:/deploy:ro
    depends_on:
      patchlog:
        condition: service_healthy

  # The services follow the core directly, not through the CDN.
  index:
    <<: *patchlog
    command: [index, -api=http://patchlog:8080, -ns=demo, -branches, -db=/data/index.db, -addr=:8081, -purge-url=http://cdn:8080/, -shutdown-timeout=20s]
    ports:
      - "${INDEX_DIRECT_PORT:-9081}:8081"
    healthcheck:
      test: ["CMD", "patchlog", "health", "http://localhost:8081/_health"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      seed:
        condition: service_completed_successfully

  # One tree service for both catalogs, each at /{catalog}/… with its own
  # database (tree-cat.db, tree-topics.db).
  tree:
    <<: *patchlog
    command: [tree, -api=http://patchlog:8080, -catalog=cat, -catalog=topics, "-db=/data/tree-{catalog}.db", -addr=:8082, -purge-url=http://cdn:8080/, -shutdown-timeout=20s]
    ports:
      - "${TREE_DIRECT_PORT:-9082}:8082"
    healthcheck:
      test: ["CMD", "patchlog", "health", "http://localhost:8082/_health"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      seed:
        condition: service_completed_successfully

  janitor:
    <<: *patchlog
    command: [janitor, -api=http://patchlog:8080, -ns=demo]
    depends_on:
      seed:
        condition: service_completed_successfully

  # The local CDN: one varnishd with a listener per origin (the VCL picks
  # the backend by listener name). It resolves the origins' host names when
  # it loads the VCL, so it starts once they are up and healthy; if one is
  # recreated with a new address, `docker compose restart cdn`. Its backend
  # probes read /_health too, so a draining origin leaves rotation.
  cdn:
    image: ${VARNISH_IMAGE:-varnish:7.7}
    restart: unless-stopped
    entrypoint: ["varnishd"]
    command:
      - -F
      - -f
      - /etc/varnish/default.vcl
      - -n
      - /var/lib/varnish/varnishd
      - -a
      - core=:8080
      - -a
      - search=:8081
      - -a
      - tree=:8082
      - -s
      - malloc,256m
    volumes:
      - ./deploy/varnish:/etc/varnish:ro
    tmpfs:
      - /var/lib/varnish/varnishd:exec
    ports:
      - "${PATCHLOG_PORT:-8080}:8080"
      - "${INDEX_PORT:-8081}:8081"
      - "${TREE_PORT:-8082}:8082"
    depends_on:
      patchlog:
        condition: service_healthy
      index:
        condition: service_healthy
      tree:
        condition: service_healthy

  # Optional (--profile otel): Jaeger receives OTLP traces on 4317 (gRPC)
  # and 4318 (HTTP) and shows them at http://localhost:16686. It takes no
  # metrics: export them to a collector instead, or set
  # OTEL_METRICS_EXPORTER=none (README, Observability).
  jaeger:
    image: ${JAEGER_IMAGE:-jaegertracing/jaeger:2.10.0}
    profiles: [otel]
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

volumes:
  data:
