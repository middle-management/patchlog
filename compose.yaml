# The whole stack in development mode (no authentication; X-Author names
# the author). Start it with `docker compose up --build` or `make up`;
# it needs Docker Compose 2.23.1 or newer (the dav-password config's
# `content`, below).
#
# Everything is served through a local CDN (Varnish, deploy/varnish), which
# caches by the origins' Cache-Control / CDN-Cache-Control and is purged by
# cache tag (§9). Reads and writes both go through it:
#
#   http://localhost:8080             core API (through the CDN)
#   http://localhost:8080/playground/ web playground
#   http://localhost:8081             search index (Addendum A), e.g. /demo?q=derby; the
#                                     playground's Search tab reads it through the core's
#                                     read-only proxy at /playground/index/ (-index-url)
#   http://localhost:8082             tree service (Addendum B), e.g. /cat/roots (the
#                                     catalog cat, a tree), /topics/roots (topics,
#                                     a DAG) and /drive/roots (drive, a file tree);
#                                     the playground reads it through the core's
#                                     read-only proxy at /playground/tree/
#                                     (-tree-url) and switches between them
#
# The origins, bypassing the CDN (debugging):
#
#   http://localhost:9080 core · http://localhost:9081 search · http://localhost:9082 tree
#
# Not behind the CDN:
#
#   http://localhost:8090             WebDAV gateway (patchlog dav, README "WebDAV"):
#                                     demo as a flat directory, drive as a file
#                                     tree. Log in with any user name and the
#                                     password patchlog-dev (dav below)
#
# `make cdn-check` shows caching and purging at work; send `X-Cache-Debug: 1`
# to see a response's cache tags and edge TTL.
#
# Data (databases, blob files, archives, the at-rest master key) lives in
# the `data` volume; `docker compose down -v` wipes it.
#
# Health and shutdown: the core, index, tree and dav answer GET /_health
# (200 while serving, 503 once shutdown starts; no login) and /_ready.
# Their healthchecks run `patchlog health`, so the image needs no curl or
# wget. On `docker compose stop` / `down` they drain: long-polls and event
# streams end at once, other requests get up to -shutdown-timeout (20s)
# before they are cancelled and roll back, and stop_grace_period (30s)
# leaves room for that plus the engine's and the CDN purger's own shutdown
# before Docker kills the process.

x-patchlog: &patchlog
  build: .
  image: patchlog:dev
  restart: unless-stopped
  # Longer than -shutdown-timeout (+ -shutdown-delay), so a graceful
  # shutdown isn't cut short by SIGKILL.
  stop_grace_period: 30s
  volumes:
    - data:/data
  environment:
    # Browser pages on other origins (a demo app): e.g.
    # PATCHLOG_CORS_ORIGINS=http://localhost:5173 docker compose up, or *.
    PATCHLOG_CORS_ORIGINS: ${PATCHLOG_CORS_ORIGINS:-}
    # OpenTelemetry (README, Observability): off unless an endpoint or
    # exporter is set, e.g. with the jaeger profile below:
    #   OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 OTEL_METRICS_EXPORTER=none \
    #     docker compose --profile otel up --build
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}
    OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
    OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
    OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-}
    OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}

services:
  patchlog:
    <<: *patchlog
    command:
      - serve
      - -dev
      - -addr=:8080
      # URLs the core generates point at the CDN.
      - -origin=${PATCHLOG_ORIGIN:-http://localhost:8080}
      - -db=/data/patchlog.db
      - -blob-dir=/data/blobs
      - -archive=file:///data/archive
      - -master-key=/data/master.key
      - -master-key-create
      # The playground's Catalog tab reads the tree service through a
      # same-origin, GET-only proxy at /playground/tree/. The tree service
      # starts after the core (it waits for the seed), so the proxy answers
      # 502 until it is up. It serves every catalog (cat, topics, drive); a
      # catalog served elsewhere would be mapped with another -tree-url
      # CATALOG=URL.
      - -tree-url=http://tree:8082
      # The Search tab reads the index the same way, at /playground/index/.
      # It follows demo; like the tree service it starts after the seed.
      - -index-url=http://index:8081
      # The Schemas tab plans imports of external JSON Schemas; the core
      # fetches the URLs it is given, from these hosts only (and never from
      # private addresses unless listed). Without -schema-fetch the tab takes
      # uploaded files only.
      - -schema-fetch
      - -schema-fetch-hosts=www.schemastore.org,json.schemastore.org,raw.githubusercontent.com
      # Cache-tag purges (tombstone purges, namespace purges, …). The CDN
      # starts last; purges sent before it is up are logged and dropped,
      # which is harmless: nothing is cached yet.
      - -purge-url=http://cdn:8080/
      # Graceful shutdown: in-flight requests get 20s, under the 30s
      # stop_grace_period. With a load balancer in front of several
      # instances, add e.g. -shutdown-delay=5s so it sees /_health go 503
      # before the listener closes (one instance behind the CDN gains
      # nothing from it).
      - -shutdown-timeout=20s
    ports:
      - "${CORE_DIRECT_PORT:-9080}:8080"
    healthcheck:
      test: ["CMD", "patchlog", "health", "http://localhost:8080/_health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: creates the demo namespaces (among them three catalogs, cat as a
  # tree, topics as a DAG and drive as a file tree of the namespace files, a
  # sealed and an e2e namespace), schemas and a few documents and files.
  # Talks to the core directly.
  seed:
    image: curlimages/curl:8.16.0
    entrypoint: ["sh", "/deploy/seed.sh"]
    restart: "no"
    volumes:
      - ./deploy:/deploy:ro
    depends_on:
      patchlog:
        condition: service_healthy

  # The services follow the core directly, not through the CDN.
  index:
    <<: *patchlog
    command: [index, -api=http://patchlog:8080, -ns=demo, -branches, -db=/data/index.db, -addr=:8081, -purge-url=http://cdn:8080/, -shutdown-timeout=20s]
    ports:
      - "${INDEX_DIRECT_PORT:-9081}:8081"
    healthcheck:
      test: ["CMD", "patchlog", "health", "http://localhost:8081/_health"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      seed:
        condition: service_completed_successfully

  # One tree service for the three catalogs, each at /{catalog}/… with its
  # own database (tree-cat.db, tree-topics.db, tree-drive.db). drive is a
  # file tree (§H.2), so its listings carry each file's size, type and time
  # (§H.3), which the WebDAV gateway lists folders from.
  tree:
    <<: *patchlog
    command: [tree, -api=http://patchlog:8080, -catalog=cat, -catalog=topics, -catalog=drive, "-db=/data/tree-{catalog}.db", -addr=:8082, -purge-url=http://cdn:8080/, -shutdown-timeout=20s]
    ports:
      - "${TREE_DIRECT_PORT:-9082}:8082"
    healthcheck:
      test: ["CMD", "patchlog", "health", "http://localhost:8082/_health"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      seed:
        condition: service_completed_successfully

  # The branch janitor (§F.6) for demo's branches. Its purges are writes:
  # by X-Author janitor, since the -dev core refuses a write without one
  # (§7.2).
  janitor:
    <<: *patchlog
    command: [janitor, -api=http://patchlog:8080, -ns=demo, -author=janitor]
    depends_on:
      seed:
        condition: service_completed_successfully

  # The WebDAV gateway (README "WebDAV"), a network drive for file managers,
  # editors and rclone: demo as a flat directory of its documents, and
  # drive as a file tree whose folders the tree service lists. files,
  # drive's content namespace, isn't served flat: drive owns it (§H.2),
  # and a rename or delete there (a copy and a delete, §H.2 "Flat view")
  # would leave drive's placement dangling. Local mode against the -dev
  # core: no grant, its writes by X-Author dav. WebDAV clients log in with
  # any user name and the password in the dav-password config below:
  # patchlog-dev, or DAV_PASSWORD's, read when the container is created
  # (`DAV_PASSWORD=… docker compose up -d --force-recreate dav` changes
  # it). It is a development password, published in this file: like the
  # rest of this stack, keep the port to yourself. Plain HTTP, and not
  # through the CDN, which has nothing to cache for WebDAV clients. It
  # keeps nothing but memory caches (a restart loses locks and temporary
  # files, not files), so it doesn't mount the data volume, which holds
  # the core's databases and master key: /data is an empty tmpfs.
  dav:
    <<: *patchlog
    volumes: []
    tmpfs:
      - /data
    command: [dav, -api=http://patchlog:8080, -ns=demo, -catalog=drive, -tree-url=http://tree:8082, -addr=:8090, -password-file=/run/dav.password, -author=dav, -shutdown-timeout=20s]
    configs:
      # Copied into the container, readable by its user (patchlog, 10001)
      # only, so dav doesn't warn of a password file others may read.
      - source: dav-password
        target: /run/dav.password
        uid: "10001"
        mode: 0400
    ports:
      - "${DAV_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "patchlog", "health", "http://localhost:8090/_health"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      seed:
        condition: service_completed_successfully
      tree:
        condition: service_healthy

  # The local CDN: one varnishd with a listener per origin (the VCL picks
  # the backend by listener name). It resolves the origins' host names when
  # it loads the VCL, so it starts once they are up and healthy; if one is
  # recreated with a new address, `docker compose restart cdn`. Its backend
  # probes read /_health too, so a draining origin leaves rotation.
  cdn:
    image: ${VARNISH_IMAGE:-varnish:7.7}
    restart: unless-stopped
    entrypoint: ["varnishd"]
    command:
      - -F
      - -f
      - /etc/varnish/default.vcl
      - -n
      - /var/lib/varnish/varnishd
      - -a
      - core=:8080
      - -a
      - search=:8081
      - -a
      - tree=:8082
      - -s
      - malloc,256m
    volumes:
      - ./deploy/varnish:/etc/varnish:ro
    tmpfs:
      - /var/lib/varnish/varnishd:exec
    ports:
      - "${PATCHLOG_PORT:-8080}:8080"
      - "${INDEX_PORT:-8081}:8081"
      - "${TREE_PORT:-8082}:8082"
    depends_on:
      patchlog:
        condition: service_healthy
      index:
        condition: service_healthy
      tree:
        condition: service_healthy

  # Optional (--profile otel): Jaeger receives OTLP traces on 4317 (gRPC)
  # and 4318 (HTTP) and shows them at http://localhost:16686. It takes no
  # metrics: export them to a collector instead, or set
  # OTEL_METRICS_EXPORTER=none (README, Observability).
  jaeger:
    image: ${JAEGER_IMAGE:-jaegertracing/jaeger:2.10.0}
    profiles: [otel]
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

volumes:
  data:

configs:
  # The WebDAV gateway's password (dav above). Development only. A config's
  # `content` needs Docker Compose 2.23.1 or newer; older ones refuse this
  # whole file.
  dav-password:
    content: ${DAV_PASSWORD:-patchlog-dev}
